[package]
name = "pygamest-runtime"
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GuYeying/pygamest-runtime"
description = "pygamest 游戏运行时（生产宿主）——入口编译期加密嵌入 + 散文件清单形态，锁死无 CLI/REPL/脚本面"

[dependencies]
# 全量 pygame 库面（gui + 2d/3d 物理 + net/dialog 无条件注册——2026-11-02
# 宿主方向 feature 废除定约）；不带 stdlib-full = 裁剪版 stdlib。
# dev 仓以 default-features = false 消费（只借 Host trait + 驱动，不回灌
# 它的默认全量轴——feature 并集从此可控）
pygamest = { git = "https://github.com/GuYeying/pygamest", default-features = false }
pygamest-dev = { git = "https://github.com/GuYeying/pygamest-dev", default-features = false }
starfish-pygame = { git = "https://github.com/GuYeying/starfish" }
starfish-io = { git = "https://github.com/GuYeying/starfish" }
starfish-debug = { git = "https://github.com/GuYeying/starfish" }
starfish-std = { git = "https://github.com/GuYeying/starfish" }
starfish-we = { git = "https://github.com/GuYeying/starfish" }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

# 编译期入口加密（build.rs：main.py → SFXE1 密文 → include_bytes! 嵌入
# ——磁盘零 main 文件、二进制零明文，2026-11-03 用户定约）
[build-dependencies]
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[features]
# 能力轴透传（对齐 pygamest 同名轴）：default = 全量形态；剔除 =
# --no-default-features 或按需组合（打包脚本 --features 透传）。
# ⚠️ ozz 入 default → 构建须 nightly 工具链（上游 std::simd）。
default = ["gui", "physics2d", "physics3d", "spine", "live2d", "ozz"]
gui = ["pygamest/gui"]
physics2d = ["pygamest/physics2d"]
physics3d = ["pygamest/physics3d"]
spine = ["pygamest/spine"]
live2d = ["pygamest/live2d"]
ozz = ["pygamest/ozz"]
# 全量标准库（开发/调试用——生产导出缺省不含）
stdlib-full = ["pygamest/stdlib-full"]

# Web 构建前置（app_entry! 的 start 属性路径在用户 crate 解析；版本
# 与依赖树严格一致——wasm-bindgen-cli 自检同规）
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"

[profile.release]
strip = true
lto = true

[[bin]]
name = "runtime"
path = "src/bin/runtime.rs"

# Android 形态 = **Java 宿主 + JNI 嵌入面**（卓易通兼容形态，2026-11-08
# 定约——NativeActivity 纯原生形态在卓易通秒闪退实测；dev 同 Java 形态
# 真机实证完美）。源 = examples/runtime_android.rs；入口 main.py 密文
# 仍嵌 .so（build.rs 同款），代码面 = JNI attachSurface/runEmbedded。
[[example]]
name = "runtime_android"
path = "examples/runtime_android.rs"
crate-type = ["cdylib"]

# Android 宿主面：embedded（外部 Surface 注入门面——starfish-we 门面 +
# pygamest-dev mobile 模块）；jni-sys = JNI 签名；ndk-context = JNI 消费
# 方（cpal 音频等）的 Context 绑定（nativeInitContext 注入——嵌入形态
# 无 glue 无人初始化，缺了脚本一碰音频即 panic，dev 真机实证）
[target.'cfg(target_os = "android")'.dependencies]
starfish-std = { git = "https://github.com/GuYeying/starfish", features = ["we"] }
starfish-we = { git = "https://github.com/GuYeying/starfish", features = ["embedded"] }
jni-sys = "0.3"
ndk-context = "0.1.1"
# android_main 符号 satisfy 的类型来源（AndroidApp——空实现，JNI 形态
# 不走 NativeActivity 路径）
android-activity = "0.6"

# vello_common 0.2.0 strip 光栅化 NaN 防御（vendor 源在 pygamest 仓——
# 详注见 pygamest Cargo.toml [patch.crates-io]）
[patch.crates-io]
vello_common = { path = "../pygame-rs/vendor/vello_common" }
