# pack.toml——游戏打包配置（单一配置源：build.rs / build_windows.py 同读）

[game]
name = "anim3"
entry = "main"

[build]
# key_file 相对**游戏项目根**（[scripts] root）——每游戏一份密钥；
# 缺失时 build_windows.py 自动生成写入（分发勿携、入 .gitignore）
key_file = "assets.key"
magic = "SFXE1"
out = "dist"

[pack]
# 剔除 glob（对资源 bundle 生效；相对资源目录）。密钥文件由管线恒剔除
# （无需在此列出）；点开头/__pycache__ 由 bundle.py 内建剔除
ignore = ["*.log"]

[scripts]
root = "examples/anim3"

[resources]
# dir 末段目录名 = 发行资源目录名（build.rs 解析同名值 → RES_DIR_NAME 编译进壳）
dir = "examples/anim3/assets"

[windows]

[android]
package = "org.runtime.anim3"
# 横竖屏（Android 原生 screenOrientation 取值）——与 dev 侧 --orientation
# 同语义：landscape / portrait / sensorLandscape / sensorPortrait…
orientation = "sensorLandscape"

[wasm]
# 资源前缀（wasm 导出嵌网站子路径时的资源根 URL——如 "games/anim3"；
# 空 = 页面相对语义。编译期嵌入壳，游戏资产与 wasm 的网站放置位置在此
# 一次声明；也接受完整 CDN URL）
base_url = ""
